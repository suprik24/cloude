# Weekly dependency update PRs, one grouped PR per ecosystem (type).
# PRs go through CI and branch protection like any other PR.
version: 2
updates:
  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # JS dependencies from package.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      js:
        patterns: ['*']
