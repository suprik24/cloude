# Weekly dependency update PRs, one grouped PR per ecosystem (type).
# PRs go through CI and branch protection like any other PR.
version: 2
updates:
  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # JS dependencies from package.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Minor and patch updates together; each major update gets its own PR
      js:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @astrojs/check only supports TypeScript 5–6 (peer dependency), so a
      # TypeScript major bump breaks `npm ci`. Remove once it supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
