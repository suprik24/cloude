# check:  every Pull Request into main and every push to main (required by branch protection).
# deploy: only on push to main (i.e. after a PR is merged), only if check passed.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # Clean install exactly from package-lock.json
      - run: npm ci

      # Type check (astro check: .astro, .svelte and .ts files)
      - run: npm run check

      # Production build for Cloudflare Workers
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Apply new D1 migrations (already applied ones are skipped)
      - run: npx wrangler d1 migrations apply cloude-db --remote

      # astro build + wrangler deploy
      - run: npm run deploy
